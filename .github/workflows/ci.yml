name: CI

on:
  pull_request:
    branches: [better, main]
  push:
    branches: [better, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck + Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @conectavet/db db:generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Build web
        run: pnpm build
        env:
          # Build sin DB ni credenciales — solo necesita compilar.
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: apps/web/.next/
          retention-days: 7
          if-no-files-found: ignore