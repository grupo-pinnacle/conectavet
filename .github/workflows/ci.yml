name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-unit:
    name: Backend - Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - run: npm ci
      - name: Run Unit Tests
        run: npx jest --selectProjects unit
        working-directory: backend
        env:
          JWT_SECRET: test-secret-github-actions

  backend-integration:
    name: Backend - Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - run: npm ci
      - name: Type Check
        run: npx tsc --noEmit
        working-directory: backend
      - name: Run Integration Tests
        run: npx jest --selectProjects integration
        working-directory: backend
        env:
          JWT_SECRET: test-secret-github-actions
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

  web:
    name: Web - Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - run: npm ci
      - name: Build Web
        run: npm run build
        working-directory: web

  security:
    name: Security - Audit & Secret Scan
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: npm audit
        run: npm audit --audit-level=high || true
      - name: gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --no-history --source .

  deploy:
    name: Backend - Deploy to Railway
    needs: [backend-unit, backend-integration, web]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Deploy to Railway
        run: railway up --service conectavet-api
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        working-directory: backend

  smoke-test:
    name: Smoke Test - Health Check
    needs: [deploy]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Wait for deploy to settle
        run: sleep 15
      - name: Check /health endpoint
        env:
          HEALTH_URL: ${{ secrets.HEALTH_URL || 'https://api.conectavet.com/health' }}
        run: |
          for i in $(seq 1 5); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" || echo "000")
            if [ "$STATUS" = "200" ]; then
              BODY=$(curl -s "$HEALTH_URL")
              echo "Health check passed: $BODY"
              echo "$BODY" | grep -q '"database":"connected"' && exit 0 || echo "WARNING: database not connected"
            fi
            echo "Attempt $i/5 failed (HTTP $STATUS). Retrying in 10s..."
            sleep 10
          done
          echo "Smoke test failed after 5 attempts"
          exit 1
